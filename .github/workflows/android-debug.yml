name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, "experiment/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Strip sherpa bundled ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path

          src = Path('app/libs/sherpa-onnx-1.13.8.aar')
          tmp = src.with_suffix('.aar.tmp')
          removed = []
          with ZipFile(src, 'r') as zin, ZipFile(tmp, 'w', compression=ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  name = item.filename
                  if name.endswith('/libonnxruntime.so') or name == 'libonnxruntime.so':
                      removed.append(name)
                      continue
                  zout.writestr(item, zin.read(item.filename))
          if not removed:
              raise SystemExit('Expected sherpa AAR to contain libonnxruntime.so, but none was found')
          tmp.replace(src)
          print('Removed from sherpa AAR:')
          for name in removed:
              print(' -', name)
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify ONNX Runtime native versions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/orbi-apk-check
          mkdir -p /tmp/orbi-apk-check
          unzip -q "$APK" 'lib/arm64-v8a/libonnxruntime.so' 'lib/arm64-v8a/libonnxruntime4j_jni.so' -d /tmp/orbi-apk-check
          echo 'libonnxruntime.so:'
          strings /tmp/orbi-apk-check/lib/arm64-v8a/libonnxruntime.so | grep -m1 -E '^1\.30\.'
          echo 'libonnxruntime4j_jni.so:'
          strings /tmp/orbi-apk-check/lib/arm64-v8a/libonnxruntime4j_jni.so | grep -m1 -E '^1\.30\.'

      - uses: actions/upload-artifact@v4
        with:
          name: ORBI-OmniVoice-EdgeLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
