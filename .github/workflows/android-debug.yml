name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, "experiment/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build isolated official Sherpa AAR
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf

          rm -rf /tmp/sherpa-official.aar /tmp/sherpa-aar
          mkdir -p /tmp/sherpa-aar app/libs
          curl -fL --retry 3 \
            -o /tmp/sherpa-official.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  /tmp/sherpa-official.aar" | sha256sum -c -

          cd /tmp/sherpa-aar
          unzip -q /tmp/sherpa-official.aar

          # Edge Lab is arm64-only. Keep the official Sherpa native stack that already proved
          # transcription on the POCO, but rename its private ORT so OmniVoice can retain 1.30.0.
          find jni -mindepth 1 -maxdepth 1 -type d ! -name 'arm64-v8a' -exec rm -rf {} +
          cd jni/arm64-v8a
          test -f libonnxruntime.so
          mv libonnxruntime.so libsherpa_onnxruntime.so
          rm -f libonnxruntime4j_jni.so
          patchelf --set-soname libsherpa_onnxruntime.so libsherpa_onnxruntime.so

          for so in *.so; do
            [ "$so" = "libsherpa_onnxruntime.so" ] && continue
            if patchelf --print-needed "$so" | grep -qx 'libonnxruntime.so'; then
              patchelf --replace-needed libonnxruntime.so libsherpa_onnxruntime.so "$so"
            fi
          done

          patchelf --print-needed libsherpa-onnx-jni.so | grep -qx 'libsherpa_onnxruntime.so'
          cd /tmp/sherpa-aar
          zip -qr "${GITHUB_WORKSPACE}/app/libs/sherpa-onnx-1.13.8.aar" .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify isolated ASR and OmniVoice native stacks
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/orbi-apk-check
          mkdir -p /tmp/orbi-apk-check
          unzip -q "$APK" \
            'lib/arm64-v8a/libonnxruntime.so' \
            'lib/arm64-v8a/libonnxruntime4j_jni.so' \
            'lib/arm64-v8a/libsherpa_onnxruntime.so' \
            'lib/arm64-v8a/libsherpa-onnx-jni.so' \
            -d /tmp/orbi-apk-check

          echo 'OmniVoice ORT:'
          strings /tmp/orbi-apk-check/lib/arm64-v8a/libonnxruntime.so | grep -m1 -E '^1\.30\.'
          echo 'OmniVoice Java/JNI:'
          strings /tmp/orbi-apk-check/lib/arm64-v8a/libonnxruntime4j_jni.so | grep -m1 -E '^1\.30\.'
          echo 'Sherpa private ORT:'
          strings /tmp/orbi-apk-check/lib/arm64-v8a/libsherpa_onnxruntime.so | grep -m1 -E '^1\.'
          echo 'Sherpa JNI dependency:'
          patchelf --print-needed /tmp/orbi-apk-check/lib/arm64-v8a/libsherpa-onnx-jni.so | grep -qx 'libsherpa_onnxruntime.so'

          found=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -q 'com/k2fsa/sherpa/onnx/OfflineRecognizer'; then
              found=1
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$')
          test "$found" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: ORBI-OmniVoice-EdgeLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
